[package]
name = "dis_m9"
version = "0.1.0"
edition = "2021"
description = "Deterministic Capability Binder (M9), Rust and PyO3"

[lib]
name = "dis_m9"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
