[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-aware-dis"
version = "0.1.0"
description = "A trust-aware digital immune system that treats its own defenders as attack surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "simpy>=4.0",
    "pyyaml>=6.0",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "ruff>=0.4",
]
m9 = [
    "maturin>=1.5",
]
agents = [
    "langgraph>=1.0",
    "mcp>=1.0",
]
console = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
deploy = [
    "redis>=5.0",
]

[tool.setuptools.packages.find]
include = [
    "shared*",
    "m1_monitoring*",
    "m4_response_engine*",
    "m5_immune_memory*",
    "m6_trust_fusion*",
    "m7_self_healing*",
    "m8_eval_harness*",
    "m9_capability_binder*",
    "m10_persona_drift*",
    "m11_memory_hardening*",
    "agents*",
    "console*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shared", "m1_monitoring"]
